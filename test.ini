;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;                            HOST-NATIVE UNIT TESTS                                    ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; pio test -c test.ini -e native                   run every suite
; pio test -c test.ini -e native -f test_msgpack   run one suite
; pio test -c test.ini -e native_asan              same suites under ASan+UBSan
;
; STANDALONE: not in platformio.ini's extra_configs, so `pio run` never sees
; [env:native]. The trade is the explicit -c on every test command.
;
; build_src_filter drops src_dir, so a suite links only its own sources plus
; whatever it includes out of lib/ and test/shim. Units under ESPGeiger/src
; needing a .cpp are pulled in per suite by a prod_*.cpp.
;
; LDF stays in chain mode; `off` would also hide Unity's own headers. Chain
; will not resolve a header-only lib whose headers sit at the directory root
; rather than under src/, so those get an explicit -I below.

[platformio]
test_dir = test
lib_dir  = lib
src_dir  = ESPGeiger

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_src_filter = -<*>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wno-unused-parameter
  -DNATIVE_TEST
  -fno-signed-char
  -I test/shim
  -I ESPGeiger/src
  -I lib/CircularBuffer-1.4.0
  -I test/fake_lwip
  -I ${platformio.packages_dir}/framework-arduinoespressif8266/tools/sdk/lwip2/include
  -I lib/EGAsyncTCP/src
  -I lib/async-mqtt-client/src

; Same suites under ASan + UBSan. An out-of-bounds write or use-after-free
; faults on the offending instruction; on target the same fault surfaces as
; delayed pool corruption in an unrelated stack. Run whenever a buffer or
; lifetime seam changes.
[env:native_asan]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -g
  -O1
  -fno-omit-frame-pointer
  -fsanitize=address
  -fsanitize=undefined
  -fno-sanitize-recover=all
