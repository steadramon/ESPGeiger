; host tests
; pio test -c test.ini -e native                       run every suite
; pio test -c test.ini -e native -f app/test_msgpack   run one suite
; not in extra_configs; suites link what they include + test/shim

[platformio]
test_dir = test
lib_dir  = lib
src_dir  = ESPGeiger

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_src_filter = -<*>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror
  -Wno-unused-parameter
  -DNATIVE_TEST
  -fno-signed-char
  -I test/shim
  -I .
  -I ESPGeiger/src
  -I lib/EGText/src
  -I lib/EGMqtt/src
