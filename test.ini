;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;                            HOST-NATIVE UNIT TESTS                                    ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; pio test -c test.ini -e native                   run every suite
; pio test -c test.ini -e native -f test_msgpack   run one suite
; pio test -c test.ini -e native_asan              same suites under ASan+UBSan
;
; Standalone: not in platformio.ini's extra_configs, so `pio run` never sees
; [env:native].
;
; build_src_filter drops src_dir, so a suite links only its own sources plus
; whatever it includes out of lib/, vendor/ and test/shim. Units under ESPGeiger/src
; needing a .cpp are pulled in per suite by a prod_*.cpp.
;
; LDF stays in chain mode; `off` would also hide Unity's own headers. Chain
; will not resolve a header-only lib whose headers sit at the directory root
; rather than under src/, so those get an explicit -I below.

[platformio]
test_dir = test
lib_dir  = lib
src_dir  = ESPGeiger

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_extra_dirs = vendor
extra_scripts = pre:test/lib_flags.py
build_src_filter = -<*>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror
  -Wno-unused-parameter
  ; clang only. All packet classes carry _parsingInformation; PingResp parses nothing.
  -Wno-unused-private-field
  -DNATIVE_TEST
  -fno-signed-char
  -I test/shim
  -I ESPGeiger/src
  -I vendor/CircularBuffer-1.4.0
  -I test/fake_lwip
  -I ${platformio.packages_dir}/framework-arduinoespressif8266/tools/sdk/lwip2/include
  -I lib/EGAsyncTCP/src
  -I lib/EGTcp/src
  -I lib/EGMqtt/src
  -I lib/EGTimer1/src
  -I lib/EGText/src
  -I lib/EGBase64/src
  -I lib/BoschTHP/src
  -I lib/AsairAHT/src
  -I lib/EGMax7219/src
  -I test/fake_fs
lib_deps =
  bblanchon/ArduinoJson@6.21.6
  olikraus/U8g2@2.36.18
; test_sdcard has its own SdFat.h; the vendored one does not build on the host.
lib_ignore =
  SdFat

; Same suites under ASan + UBSan. Run whenever a buffer or lifetime seam
; changes: on target the same fault is delayed pool corruption elsewhere.
[env:native_asan]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -g
  -O1
  -fno-omit-frame-pointer
  -fsanitize=address
  -fsanitize=undefined
  -fno-sanitize-recover=all

; ThreadSanitizer, test_race_* only.
[env:native_tsan]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -g
  -O1
  -fno-omit-frame-pointer
  -fsanitize=thread
