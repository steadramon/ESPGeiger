;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;                            HOST-NATIVE UNIT TESTS                                    ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; pio test -c test.ini -e native                       run every suite
; pio test -c test.ini -e native -f app/test_msgpack   run one suite
;
; Unity on the host, no board needed. Standalone: not in platformio.ini's
; extra_configs, so `pio run` never sees [env:native].
;
; build_src_filter drops src_dir, so a suite links only what it includes, plus
; test/shim for the few Arduino bits the code uses.

[platformio]
test_dir = test
lib_dir  = lib
src_dir  = ESPGeiger

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_src_filter = -<*>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror
  -Wno-unused-parameter
  -DNATIVE_TEST
  -fno-signed-char
  -I test/shim
  -I .
  -I ESPGeiger/src
  -I lib/EGText/src
  -I lib/EGMqtt/src
